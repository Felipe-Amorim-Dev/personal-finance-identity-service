name: .NET build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore PersonalFinance.Identity.sln
      - run: dotnet build PersonalFinance.Identity.sln --no-restore --configuration Release
      - run: dotnet test PersonalFinance.Identity.sln --no-build --configuration Release --verbosity normal
